name: Docker build

on:
  push:
    paths:
      - "apps/backend/**"
      - "apps/dashboard/**"
      - "apps/infrastructure/docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/dashboard/**"
      - "apps/infrastructure/docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: apps/infrastructure/docker/backend.Dockerfile
          - name: dashboard
            dockerfile: apps/infrastructure/docker/dashboard.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
